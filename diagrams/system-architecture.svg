<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="1700" height="620" fill="#ffffff"/>
  <text x="850" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b1b2f">System Architecture — Wearable Fatigue Detection Pipeline</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#457b9d"/>
    </marker>
  </defs>

  <!-- Stage 1: Wearable -->
  <rect x="40" y="220" width="280" height="180" rx="10" fill="#eef4fb" stroke="#2c3e50" stroke-width="2"/>
  <text x="180" y="255" text-anchor="middle" font-size="15" font-weight="bold">Wearable Node</text>
  <text x="180" y="280" text-anchor="middle" font-size="12">MAX30102 (HR / SpO2)</text>
  <text x="180" y="298" text-anchor="middle" font-size="12">MPU6050 (motion)</text>
  <text x="180" y="316" text-anchor="middle" font-size="12">ESP32 (sampling +</text>
  <text x="180" y="332" text-anchor="middle" font-size="12">timestamp + local buffer)</text>
  <text x="180" y="356" text-anchor="middle" font-size="12" fill="#555">Battery + TP4056 +</text>
  <text x="180" y="372" text-anchor="middle" font-size="12" fill="#555">boost converter</text>

  <line x1="320" y1="310" x2="440" y2="310" stroke="#457b9d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="290" text-anchor="middle" font-size="11">WiFi</text>
  <text x="380" y="330" text-anchor="middle" font-size="10" fill="#555">JSON: HR, SpO2,</text>
  <text x="380" y="343" text-anchor="middle" font-size="10" fill="#555">accel, timestamp</text>

  <!-- Stage 2: Cloud -->
  <rect x="450" y="220" width="280" height="180" rx="10" fill="#e8f0fe" stroke="#457b9d" stroke-width="2"/>
  <text x="590" y="255" text-anchor="middle" font-size="15" font-weight="bold">Cloud / Server</text>
  <text x="590" y="280" text-anchor="middle" font-size="12">MQTT broker or HTTP API</text>
  <text x="590" y="298" text-anchor="middle" font-size="12">(Firebase / ThingSpeak /</text>
  <text x="590" y="314" text-anchor="middle" font-size="12">AWS IoT / self-hosted)</text>
  <text x="590" y="340" text-anchor="middle" font-size="12" fill="#555">Time-series database</text>
  <text x="590" y="356" text-anchor="middle" font-size="12" fill="#555">stores raw sensor stream</text>

  <line x1="730" y1="310" x2="850" y2="310" stroke="#457b9d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="790" y="290" text-anchor="middle" font-size="11">query / export</text>

  <!-- Stage 3: ML pipeline -->
  <rect x="860" y="180" width="340" height="260" rx="10" fill="#fdf3e7" stroke="#c98a2c" stroke-width="2"/>
  <text x="1030" y="212" text-anchor="middle" font-size="15" font-weight="bold">ML Pipeline (Computer)</text>
  <rect x="885" y="230" width="290" height="36" rx="6" fill="#fff" stroke="#c98a2c"/>
  <text x="1030" y="253" text-anchor="middle" font-size="12">1. Clean + resample data</text>
  <rect x="885" y="274" width="290" height="36" rx="6" fill="#fff" stroke="#c98a2c"/>
  <text x="1030" y="297" text-anchor="middle" font-size="12">2. Extract HRV / motion features</text>
  <rect x="885" y="318" width="290" height="36" rx="6" fill="#fff" stroke="#c98a2c"/>
  <text x="1030" y="341" text-anchor="middle" font-size="12">3. Classify (SVM / RF / LSTM)</text>
  <rect x="885" y="362" width="290" height="36" rx="6" fill="#fff" stroke="#c98a2c"/>
  <text x="1030" y="385" text-anchor="middle" font-size="12">4. Output fatigue score / label</text>

  <line x1="1200" y1="310" x2="1320" y2="310" stroke="#457b9d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Output -->
  <rect x="1330" y="220" width="300" height="180" rx="10" fill="#eafaf1" stroke="#2c9c5f" stroke-width="2"/>
  <text x="1480" y="255" text-anchor="middle" font-size="15" font-weight="bold">Output</text>
  <text x="1480" y="285" text-anchor="middle" font-size="12">Dashboard / alert</text>
  <text x="1480" y="303" text-anchor="middle" font-size="12">(fatigue level, trend chart)</text>
  <text x="1480" y="329" text-anchor="middle" font-size="12" fill="#555">Optional: command sent</text>
  <text x="1480" y="345" text-anchor="middle" font-size="12" fill="#555">back to wearable to</text>
  <text x="1480" y="361" text-anchor="middle" font-size="12" fill="#555">trigger buzzer/LED alert</text>

  <!-- feedback loop -->
  <path d="M1330,360 C900,470 400,470 180,400" fill="none" stroke="#2c9c5f" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
  <text x="750" y="500" text-anchor="middle" font-size="12" fill="#2c9c5f">Optional feedback: cloud pushes alert command back to ESP32 (buzzer / LED)</text>

  <text x="850" y="580" text-anchor="middle" font-size="12" fill="#666">Data path: Wearable → WiFi → Cloud storage → ML processing (offline/near-real-time) → Fatigue output</text>
</svg>
