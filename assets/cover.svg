<rect x="630" y="290" width="225" height="120" rx="8" fill="#071d44" stroke="#5CE1E6" stroke-width="2"/><text x="652" y="342" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#EAF6FF">Detection</text><text x="652" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8FB3D1">flags fatigue</text>
